  - id: rs_strong_aditi
    tier: strong
    name: Aditi Rao
    inputs: {reservation_category: GEN}
    sop: |
      I want to work on uncertainty estimation for medical image classifiers, specifically on how
      calibration degrades when a chest X-ray model is deployed at a hospital whose scanners differ from
      the training data. During my undergraduate research with Prof. K. Bhat at NITK I built wavelet-domain
      CNNs for ECG denoising, which taught me to evaluate models under realistic noise. At Microsoft Research
      India I studied distribution-shift detection for OCR and reduced false alarms by 23 percent, and I now
      work as a project assistant in the Vision and AI Lab at IISc with Prof. S. Menon, where I built
      calibration benchmarks across three hospital datasets. That work led to a MICCAI 2026 paper.

      The open problem I keep returning to is this: post-hoc calibration methods such as temperature scaling
      assume the shift is small, but hospital-to-hospital shift is not. I would like to study calibration
      methods that use a handful of labelled target-site images, and to ask how many such images are needed
      before the calibrated confidence becomes trustworthy enough to triage patients.

      The Department of Computational and Data Sciences at IISc is a natural fit. Prof. Menon's group works on
      trustworthy imaging, and Prof. P. Iyer's work on few-shot domain adaptation addresses exactly the
      labelled-target setting I described. I also want to take the courses on probabilistic machine learning
      and statistical learning theory, which I lack as an ECE graduate.

      In the long run I want to build diagnostic models whose confidence clinicians can rely on. A PhD in
      this group would give me the methods and the clinical collaborators to do that.
    text: |
      ADITI RAO
      aditi.rao@research.iisc.ac.in | +91 80950 66778 | github.com/aditirao | linkedin.com/in/aditi-rao-ml

      RESEARCH INTERESTS
      Trustworthy machine learning, uncertainty estimation, medical imaging

      EDUCATION
      B.Tech, Electronics and Communication Engineering, NIT Surathkal | 2021 - 2025 | CGPA 9.21/10

      RESEARCH EXPERIENCE
      Project Assistant, Vision and AI Lab, IISc Bangalore (advisor: Prof. S. Menon) | Jul 2025 - Present
      - Built calibration benchmarks for chest X-ray classifiers across 3 hospital datasets
      Research Intern, Microsoft Research India | May 2024 - Jul 2024
      - Studied distribution-shift detection for OCR; method reduced false alarms by 23%
      Undergraduate Researcher, NITK Signal Processing Lab (Prof. K. Bhat) | Jan 2023 - Dec 2023
      - Denoising ECG signals with wavelet-domain CNNs

      PUBLICATIONS
      1. A. Rao, S. Menon. "Calibrated Uncertainty for Chest X-ray Triage." MICCAI 2026 (Main Conference).
      2. A. Rao, K. Bhat. "Wavelet CNNs for ECG Denoising." IEEE SPCOM 2024.
      3. A. Rao et al. "Shift-Aware OCR Confidence." arXiv preprint 2025.

      GATE
      GATE 2025 (EC): Score 745, AIR 402

      SKILLS
      Python, PyTorch, TensorFlow, NumPy, OpenCV, MATLAB, Git, Linux

      AWARDS
      - KVPY Fellow (2019)
      - Best Paper Award, IEEE SPCOM 2024 student track
