id: higher_ed_mtech
label: M.Tech Admission (IITs / NITs via GATE)
description: >
  Taught M.Tech programmes at IITs, NITs and IIITs. Offers are made largely on
  GATE score (through COAP/CCMT); some IIT departments add a written test or
  interview. UG academics act as an eligibility floor.
examples: [IIT Madras, IIT Bombay, IIT Delhi, NIT Trichy, IIIT Hyderabad]
score_label: Admission readiness
last_reviewed: "2026-09"
notes:
  - >
    GATE cutoffs differ widely by institute, department, paper and year; the
    bands below describe a competitive profile for top IITs in popular
    departments and are indicative only.
  - >
    Anchored on published COAP 2025 closing scores. IIT (BHU) Computer Science
    closed at 772 (GEN), 721 (OBC-NCL) and 569 (SC) for the AI specialisation,
    and 757 / 706 / 564 for IoT. The older IITs run higher than this in CSE, so
    a score near 800 is what the top band describes.
  - >
    Graduates of IITs with CPI >= 8.0 are exempt from GATE at many IITs; the
    missing-GATE check is therefore a warning, not a hard fail.
sources:
  - >-
    IIT Guwahati, M.Tech eligibility (CPI 6.0 / 60%, relaxed 0.5 / 5% for
    SC/ST/PwD): https://iitg.ac.in/acad/admission/master/eligibility.php
  - >-
    IIT Delhi CSE, M.Tech shortlisting criteria 2025 (60% / GPA 6.0 GEN-EWS,
    55% / 5.5 SC-ST-PH):
    https://www.cse.iitd.ac.in/~rjaiswal/mtech/2025/MTech-shortlisting-2025.pdf
  - >-
    IIT (BHU), GATE cutoff scores for M.Tech admission through COAP 2025:
    https://www.iitbhu.ac.in/contents/institute/admin/doc/mtech_admission_through_coap25_gate_cuttoff_scores.pdf
  - "COAP / CCMT admission brochures (GATE score validity: 3 years)"

inputs:
  - {id: reservation_category, label: Reservation category, type: choice, options: [GEN, EWS, OBC-NCL, SC, ST]}
  - {id: pwbd, label: Person with Benchmark Disability (PwBD), type: bool}

subscores:
  gate_exam:   {label: GATE Performance,           weight: 0.60}
  academics:   {label: UG Academics,               weight: 0.20}
  preparation: {label: Coursework & Projects,      weight: 0.10}
  research:    {label: Research Exposure,          weight: 0.10}

signals:
  - id: gate_result
    label: GATE score / percentile / AIR
    subscore: gate_exam
    any_of:
      - feature: exam.gate.score
        rule: {type: bands, points: [[350, 0], [500, 0.3], [600, 0.55], [700, 0.8], [800, 0.95], [900, 1]]}
      - feature: exam.gate.percentile
        rule: {type: bands, points: [[80, 0], [90, 0.35], [95, 0.6], [98, 0.85], [99.5, 1]]}
      - feature: exam.gate.air
        rule: {type: bands, points: [[1, 1], [200, 0.95], [1000, 0.8], [3000, 0.55], [8000, 0.25], [15000, 0]]}
    suggest:
      below: 0.8
      text: >
        Your GATE result ({value}) is below what top-IIT departments usually
        admit (roughly 700+ score / 98+ percentile in popular papers). Check
        each institute's previous-year COAP cutoffs, or retake GATE; scores
        stay valid for 3 years.
      text_missing: >
        No GATE result found. State it prominently near the top, e.g. "GATE
        CS 2026: Score 712 | AIR 1,240 | 98.1 percentile". It is the main
        admission criterion.

  - id: ug_cgpa
    label: UG CGPA
    subscore: academics
    any_of:
      - feature: academics.ug_cgpa
        rule: {type: bands, points: [[6, 0], [6.5, 0.2], [7.5, 0.55], [8.5, 0.85], [9.3, 1]]}
      - feature: academics.ug_pct_est      # resumes that state a percentage instead
        rule: {type: bands, points: [[57, 0], [62, 0.2], [71, 0.55], [81, 0.85], [88, 1]]}
    suggest:
      below: 0.4
      text: >
        CGPA {value} is close to the eligibility floor. Some IIT departments
        shortlist for tests/interviews with higher CGPA cutoffs, so rely on a
        strong GATE score.
      text_missing: 'State your UG CGPA (e.g. "CGPA: 8.1/10"); eligibility is checked against it.'

  - id: coursework
    label: Relevant coursework listed
    subscore: preparation
    weight: 0.5
    feature: academics.coursework_count
    rule: {type: bands, points: [[0, 0], [3, 0.5], [6, 1]]}
    missing: exclude
    suggest:
      text: Only {value} relevant course(s) listed. Name the core courses for your target specialisation.
      text_missing: >
        Add a "Relevant Coursework" line listing core courses for your target
        specialisation (e.g. Algorithms, Machine Learning, Computer Architecture).

  - id: projects
    label: Technical projects
    subscore: preparation
    weight: 0.5
    feature: projects.count
    rule: {type: bands, points: [[0, 0], [1, 0.5], [2, 0.8], [3, 1]]}
    suggest:
      text: >
        {value} project(s) listed. Include 2-3 projects in your intended
        specialisation; interviewing departments ask about them.

  - id: publications
    label: Publications
    subscore: research
    weight: 0.5
    feature: publications.count
    rule: {type: bands, points: [[0, 0], [1, 0.8], [2, 1]]}
    suggest:
      below: 0.5
      text: >
        No publications yet. They are not required for M.Tech, but a
        workshop paper or preprint from a final-year project helps with
        departments that interview.

  - id: research_experience
    label: Research internship / RA experience
    subscore: research
    weight: 0.5
    feature: research.experience_months
    rule: {type: bands, points: [[0, 0], [2, 0.5], [6, 1]]}
    missing: exclude

eligibility:
  - id: min_cgpa
    label: Minimum UG CGPA
    feature: academics.ug_cgpa
    min: 6.0
    adjust:
      - {input: reservation_category, in: [SC, ST], delta: -0.5}
      - {input: pwbd, equals: true, delta: -0.5}
    adjust_mode: largest
    message: UG CGPA {value} is below the {limit} minimum for your category.
    note: >-
      IIT Guwahati, IIT Delhi and IIT Bombay publish CPI 6.0 / 60% for GEN, EWS and
      OBC-NCL, relaxed by 0.5 CPI / 5% for SC, ST and PwD. IIT Kanpur is lower still
      (5.5 / 55%). This is the floor to be considered, not a competitive score.
  - id: min_pct
    label: Minimum UG percentage
    feature: academics.ug_pct
    min: 60
    adjust:
      - {input: reservation_category, in: [SC, ST], delta: -5}
      - {input: pwbd, equals: true, delta: -5}
    adjust_mode: largest
    when_missing: skip
    message: UG percentage {value}% is below the {limit}% minimum for your category.
  - id: gate_present
    label: Valid GATE score
    feature: exam.gate.years_since
    max: 3
    when_missing: warn
    message: "GATE taken {value} year(s) ago; scores are valid for 3 years."
    message_missing: No GATE result found on the resume.
    note: No GATE result was found. It is required unless you qualify for an exemption (e.g. IIT graduate with CPI >= 8.0).

ats: {expected_sections: [education, projects], max_pages: 2, filename_role: MTech}

generator:
  section_order: [header, gate_scorecard, education, coursework, projects, research, skills, achievements]
  emphasize: [exam.gate.score, exam.gate.air, exam.gate.percentile, academics.ug_cgpa]
