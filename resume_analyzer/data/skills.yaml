# Skills taxonomy: canonical name -> aliases, grouped by category.
#
#   name:      canonical form (also matched)
#   aliases:   other spellings, matched case-insensitively on word boundaries
#   case:      aliases (may include the name) matched case-sensitively only,
#              for acronyms that collide with normal words (AI, ML, OS)
#   list_only: aliases matched case-sensitively AND only inside a list
#              ("Languages: C, Go, R"), for single letters / common words
#
# Add a skill here and both the ATS keyword matcher and the extractor pick it up.

languages:
  - {name: Python, aliases: [Python3, Python 3]}
  - {name: Java, aliases: [Core Java, Java 8, Java 17]}
