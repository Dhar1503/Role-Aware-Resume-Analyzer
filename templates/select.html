<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Select Application Type</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="card-title text-center text-primary">Select Application Type</h2>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Choose the type of application:</label>
                        <select name="job_type" class="form-select" required>
                            <option value="On-Campus MNC">On-Campus MNC</option>
                            <option value="Off-Campus MNC">Off-Campus MNC</option>
                            <option value="Higher Studies">Higher Studies</option>
                            <option value="Research Internship">Research Internship</option>
                            <option value="Government Job">Government Job</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Next</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
