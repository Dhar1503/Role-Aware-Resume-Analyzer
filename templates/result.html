<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analysis Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #1a1a2e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header,
        .score-card,
        .section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 10px;
            text-align: center;
        }

        .metadata {
            text-align: center;
            color: #94a3b8;
            font-size: 1em;
        }

        .metadata span {
            margin: 0 15px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: inline-block;
        }

        .score-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .score-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-main {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #60a5fa 0deg, #60a5fa calc(var(--score) * 3.6deg), rgba(255, 255, 255, 0.1) calc(var(--score) * 3.6deg));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(96, 165, 250, 0.3);
            position: relative;
        }

        .score-main::before {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .score-number,
        .score-label {
            position: relative;
            z-index: 1;
        }

        .score-number {
            font-size: 3.5em;
            font-weight: 900;
            color: #60a5fa;
        }

        .score-label {
            font-size: 1em;
            color: #94a3b8;
            margin-top: 10px;
        }

        .strength-badge {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9em;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .strength-strong {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .strength-good,
        .strength-moderate {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .strength-average,
        .strength-weak {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }

        .score-info h3 {
            color: #e2e8f0;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .score-explanation {
            color: #cbd5e1;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .component-scores {
            display: grid;
            gap: 12px;
        }

        .component {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #60a5fa;
        }

        .component-label {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .component-bar {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .component-fill {
            background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            height: 100%;
            transition: width 0.5s ease;
        }

        .component-score {
            font-size: 0.85em;
            color: #94a3b8;
            margin-top: 8px;
        }

        .section h2 {
            color: #e2e8f0;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .list {
            list-style: none;
            padding: 0;
        }

        .list li {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #60a5fa;
            color: #e2e8f0;
        }

        .strengths .list li {
            border-left-color: #10b981;
        }

        .gaps .list li {
            border-left-color: #f59e0b;
        }

        .roadmap .list li {
            border-left-color: #a78bfa;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .data-item-label {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-item-value {
            color: #e2e8f0;
            font-size: 1.05em;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .button-primary {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .score-display,
            .button-group {
                grid-template-columns: 1fr;
            }

            .score-main {
                width: 150px;
                height: 150px;
            }

            .score-main::before {
                width: 120px;
                height: 120px;
            }

            .score-number {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <script>
        window.result = {{ result|tojson|safe }};
    </script>
    <div class="container">
        <div class="header" id="headerContent"></div>
        <div class="score-card" id="scoreCard"></div>
        <div class="section parsed-data" id="parsedDataSection"></div>
        <div class="section strengths" id="strengthsSection"></div>
        <div class="section gaps" id="gapsSection"></div>
        <div class="section roadmap" id="roadmapSection"></div>

        <div class="button-group">
            <button class="button button-primary" onclick="window.print()">Print Report</button>
            <a href="/analyze" class="button button-secondary">Analyze Another Resume</a>
        </div>
    </div>

    <script>
        function getResultData() {
            if (window.result) {
                return window.result;
            }

            const stored = sessionStorage.getItem('analysisResult');
            return stored ? JSON.parse(stored) : null;
        }

        function safeDate(value) {
            if (!value) {
                return "Unknown date";
            }
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? "Unknown date" : parsed.toLocaleDateString();
        }

        function displayResults() {
            const result = getResultData();

            if (!result) {
                document.body.innerHTML = '<div class="container"><div class="empty-state"><h2>No analysis results found</h2><p><a href="/analyze" class="button button-secondary">Upload a resume to analyze</a></p></div></div>';
                return;
            }

            renderHeader(result);
            renderScoreCard(result);
            renderParsedData(result);
            renderStrengths(result);
            renderGaps(result);
            renderRoadmap(result);
            sessionStorage.removeItem('analysisResult');
        }

        function renderHeader(result) {
            const metadata = result.metadata || {};
            document.getElementById('headerContent').innerHTML = `
                <h1>Analysis Complete</h1>
                <div class="metadata">
                    <span><strong>${metadata.domain || 'General'}</strong></span>
                    <span><strong>${metadata.application_type || 'Unknown Application'}</strong></span>
                    <span><strong>${safeDate(metadata.analyzed_at)}</strong></span>
                </div>
            `;
        }

        function renderScoreCard(result) {
            const evaluation = result.evaluation || {};
            const score = Number(evaluation.score || 0);
            const strength = evaluation.strength || 'Unknown';
            const strengthClass = `strength-${String(strength).toLowerCase()}`;
            const componentScores = evaluation.component_scores || {};

            const components = [
                { label: 'Skills', key: 'skills_score', fallback: 'skills', max: 25 },
                { label: 'Projects', key: 'projects_score', fallback: 'projects', max: 20 },
                { label: 'Experience', key: 'experience_score', fallback: 'experience', max: 15 },
                { label: 'Academics', key: 'academics_score', fallback: 'academics', max: 20 },
                { label: 'Certifications', key: 'certifications_score', fallback: 'certifications', max: 10 },
                { label: 'Quality', key: 'quality_score', fallback: 'quality', max: 10 }
            ];

            const componentHTML = components.map((comp) => {
                const rawScore = Number(componentScores[comp.key] ?? componentScores[comp.fallback] ?? 0);
                const percentage = comp.max ? Math.min(100, (rawScore / comp.max) * 100) : 0;
                return `
                    <div class="component">
                        <div class="component-label">${comp.label}</div>
                        <div class="component-bar">
                            <div class="component-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="component-score">${rawScore.toFixed(1)} / ${comp.max}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('scoreCard').innerHTML = `
                <div class="score-display">
                    <div class="score-circle">
                        <div class="score-main" style="--score: ${Math.max(0, Math.min(100, score))}">
                            <div class="score-number">${Math.round(score)}</div>
                            <div class="score-label">out of 100</div>
                        </div>
                        <span class="strength-badge ${strengthClass}">${strength}</span>
                    </div>
                    <div class="score-info">
                        <h3>Your Resume Score</h3>
                        <p class="score-explanation">${evaluation.explanation || 'Resume analysis complete.'}</p>
                        <div class="component-scores">${componentHTML}</div>
                    </div>
                </div>
            `;
        }

        function renderParsedData(result) {
            const parsed = result.parsed_data || {};
            const skills = Array.isArray(parsed.skills_list) ? parsed.skills_list : [];
            const education = Array.isArray(parsed.education) ? parsed.education : [];
            const contact = parsed.contact || {};

            const skillsHTML = skills.length
                ? skills.map((skill) => `<span class="skill-tag">${skill}</span>`).join('')
                : '<span class="skill-tag">No skills extracted</span>';

            document.getElementById('parsedDataSection').innerHTML = `
                <h2>Resume Information Extracted</h2>
                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-item-label">Name</div>
                        <div class="data-item-value">${parsed.name || 'Not found'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Email</div>
                        <div class="data-item-value">${contact.email || 'Not found'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Phone</div>
                        <div class="data-item-value">${contact.phone || 'Not found'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Education</div>
                        <div class="data-item-value">${education[0]?.degree || 'Not found'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">CGPA</div>
                        <div class="data-item-value">${parsed.cgpa ? Number(parsed.cgpa).toFixed(2) : 'Not found'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Projects</div>
                        <div class="data-item-value">${parsed.projects_count || 0} project(s)</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Certifications</div>
                        <div class="data-item-value">${parsed.certifications_count || 0} certification(s)</div>
                    </div>
                    <div class="data-item">
                        <div class="data-item-label">Skills</div>
                        <div class="data-item-value">${parsed.skills_count || skills.length || 0} skill(s)</div>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <div class="data-item-label">Top Skills</div>
                    <div class="skill-tags">${skillsHTML}</div>
                </div>
            `;
        }

        function renderStrengths(result) {
            const strengths = result.evaluation?.strengths || [];
            const listHTML = strengths.map((item) => `<li>${item}</li>`).join('');
            document.getElementById('strengthsSection').innerHTML = `
                <h2>Your Strengths</h2>
                <ul class="list">${listHTML || '<li>Resume shows potential for development.</li>'}</ul>
            `;
        }

        function renderGaps(result) {
            const gaps = result.evaluation?.gaps || [];
            const listHTML = gaps.map((item) => `<li>${item}</li>`).join('');
            document.getElementById('gapsSection').innerHTML = `
                <h2>Areas for Improvement</h2>
                <ul class="list">${listHTML || '<li>Continue strengthening core competencies.</li>'}</ul>
            `;
        }

        function renderRoadmap(result) {
            const roadmap = result.evaluation?.roadmap || [];
            const listHTML = roadmap.map((item) => `<li>${item}</li>`).join('');
            document.getElementById('roadmapSection').innerHTML = `
                <h2>Your Improvement Roadmap</h2>
                <ul class="list">${listHTML || '<li>Create a personalized improvement plan.</li>'}</ul>
            `;
        }

        window.addEventListener('load', displayResults);
    </script>
</body>
</html>
