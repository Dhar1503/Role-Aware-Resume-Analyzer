<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Resume Input - {{ job_type }}</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="card-title text-center text-primary">Enter Resume Details for {{ job_type }}</h2>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Skills (comma-separated):</label>
                        <input type="text" name="skills" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Number of Projects:</label>
                        <input type="number" name="num_projects" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Internships:</label>
                        <select name="internships" class="form-select" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CGPA:</label>
                        <input type="number" step="0.1" name="cgpa" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Certifications Count:</label>
                        <input type="number" name="certs" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Research Papers:</label>
                        <select name="research_papers" class="form-select" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Domain:</label>
                        <select name="domain" class="form-select" required>
                            <option value="Tech">Tech</option>
                            <option value="Business">Business</option>
                            <option value="Research">Research</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Analyze</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
